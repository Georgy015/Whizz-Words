<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Whizz Words</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="game" id="game">
    <header class="top">
      <div class="round" id="round-label">Round 1</div>
      <div class="goal">
        <div class="goal-text" id="goal-text"><span id="score">0</span> / <span id="target">0</span></div>
        <div class="goal-bar"><div class="goal-fill" id="goal-fill"></div></div>
      </div>
      <div class="counters">
        <button class="counter help" id="btn-restart" title="Start over" aria-label="Start over">↺</button>
        <button class="counter help" id="btn-help" title="How to play" aria-label="How to play">?</button>
        <button class="counter help" id="btn-pause" title="Pause" aria-label="Pause">❚❚</button>
      </div>
    </header>

    <section class="charmbar" aria-label="Your charms">
      <div class="charms" id="charms"></div>
      <div class="coins" id="coins" title="Coins">$0</div>
    </section>

    <div class="coach hidden" id="coach" role="dialog" aria-live="polite">
      <p id="coach-text"></p>
      <button class="btn primary small hidden" id="coach-btn">Next</button>
    </div>

    <section class="spell" aria-label="Your spell">
      <div class="boss-badge hidden" id="boss-badge"></div>
      <div class="preview" id="preview">
        <span class="chips" id="preview-chips">0</span>
        <span class="times">×</span>
        <span class="mult" id="preview-mult">0</span>
      </div>
      <div class="spell-slots" id="spell"></div>
      <div class="message" id="message" role="status">Tap letters to weave a word</div>
    </section>

    <section class="hand" id="hand" aria-label="Your letters"></section>

    <nav class="actions">
      <button class="btn secondary" id="btn-discard" title="Discards left this round">Discard <span class="count">♻<span id="discards">3</span></span></button>
      <button class="btn secondary" id="btn-shuffle" title="Shuffle hand">Shuffle</button>
      <button class="btn primary" id="btn-cast" title="Casts left this round">Cast <span class="count">✦<span id="plays">4</span></span></button>
    </nav>

    <aside class="log" id="log" aria-label="Spells cast"></aside>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="panel">
      <div class="cheer hidden" id="overlay-cheer">Well done!</div>
      <div class="details" id="overlay-details">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <div class="panel-actions">
          <button class="btn secondary hidden" id="overlay-alt"></button>
          <button class="btn primary" id="overlay-btn"></button>
        </div>
        <button class="btn secondary small hidden sound-toggle" id="overlay-sound"></button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="shop">
    <div class="panel shop-panel" role="dialog" aria-labelledby="shop-title">
      <h2 id="shop-title">The Spell Shop</h2>
      <p class="shop-sub">You have <b id="shop-coins">$0</b> to spend.</p>
      <div class="offers" id="offers"></div>
      <div class="panel-actions">
        <button class="btn secondary" id="shop-reroll">Reroll $1</button>
        <button class="btn primary" id="shop-leave">Continue</button>
      </div>
      <div class="shop-owned" id="shop-owned"></div>
    </div>
  </div>

  <div class="overlay hidden" id="picker">
    <div class="panel shop-panel" role="dialog" aria-labelledby="picker-title">
      <h2 id="picker-title">Boss Trials</h2>
      <p class="shop-sub">Pick a boss and play its round (target 150). You start with three practice charms: Vowel Hunter, Short &amp; Sweet and Opening Spell.</p>
      <div class="offers" id="picker-list"></div>
    </div>
  </div>

  <div class="loading" id="loading">Opening the spellbook…</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
